<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="100%" role="img" aria-labelledby="nc-hero-title nc-hero-desc">
  <title id="nc-hero-title">叙事工坊 narrative-craft</title>
  <desc id="nc-hero-desc">左侧是技能名「叙事工坊」与三项能力：雪花法搭骨架、剧作理论做诊断、去 AI 味收尾，以及修订顺序 阻断级到结构级到语言级到风格级。右侧两张卡片演示一句话前提经雪花法展开成五段结构：开端异常出现、推进因此升级、逆转但是转向、高潮前提兑现、余波留下余味。</desc>

  <defs>
    <linearGradient id="nc-paper" x1="0" y1="0" x2="0.45" y2="1">
      <stop offset="0" stop-color="#FFFDF8"/>
      <stop offset="1" stop-color="#F1E8D8"/>
    </linearGradient>
    <filter id="nc-card" x="-25%" y="-30%" width="150%" height="170%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#6B543C" flood-opacity="0.14"/>
    </filter>
    <marker id="nc-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#2F6E8F"/>
    </marker>
  </defs>

  <rect x="0.5" y="0.5" width="1199" height="519" rx="20" fill="url(#nc-paper)" stroke="#E6DCCB"/>

  <!-- 深度层 -->
  <g opacity="0.055" stroke="#C0452B" stroke-width="3" stroke-linecap="round" fill="none" transform="translate(600,270)">
    <path transform="rotate(0)" d="M0 0V-300M0 -156L52 -208M0 -156L-52 -208M0 -238L42 -280M0 -238L-42 -280"/>
    <path transform="rotate(60)" d="M0 0V-300M0 -156L52 -208M0 -156L-52 -208M0 -238L42 -280M0 -238L-42 -280"/>
    <path transform="rotate(120)" d="M0 0V-300M0 -156L52 -208M0 -156L-52 -208M0 -238L42 -280M0 -238L-42 -280"/>
    <path transform="rotate(180)" d="M0 0V-300M0 -156L52 -208M0 -156L-52 -208M0 -238L42 -280M0 -238L-42 -280"/>
    <path transform="rotate(240)" d="M0 0V-300M0 -156L52 -208M0 -156L-52 -208M0 -238L42 -280M0 -238L-42 -280"/>
    <path transform="rotate(300)" d="M0 0V-300M0 -156L52 -208M0 -156L-52 -208M0 -238L42 -280M0 -238L-42 -280"/>
  </g>
  <circle cx="1190" cy="20" r="160" fill="none" stroke="#C0452B" stroke-width="2" opacity="0.28"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">

    <!-- 左栏 -->
    <rect x="80" y="88" width="12" height="12" fill="#C0452B"/>
    <text x="104" y="99" font-size="18" letter-spacing="2" fill="#6B7785">AGENT SKILL · 中文小说叙事开发</text>
    <text x="80" y="208" font-size="96" font-weight="800" letter-spacing="4" fill="#141C26">叙事工坊</text>
    <rect x="82" y="236" width="104" height="7" fill="#C0452B"/>
    <text x="82" y="284" font-size="22" letter-spacing="7" fill="#7C8794">narrative-craft</text>

    <rect x="80" y="324" width="186" height="48" rx="24" fill="#1C2430"/>
    <rect x="278" y="324" width="206" height="48" rx="24" fill="#FFFFFF" stroke="#E3DACB"/>
    <rect x="496" y="324" width="170" height="48" rx="24" fill="#FFFFFF" stroke="#E3DACB"/>
    <text x="173" y="355" font-size="20" text-anchor="middle" fill="#FAF7F1">雪花法搭骨架</text>
    <text x="381" y="355" font-size="20" text-anchor="middle" fill="#26313D">剧作理论做诊断</text>
    <text x="581" y="355" font-size="20" text-anchor="middle" fill="#26313D">去 AI 味收尾</text>

    <text x="80" y="400" font-size="20" fill="#5C6875">修订顺序：<tspan font-weight="700" fill="#C0452B">阻断级</tspan> → 结构级 → 语言级 → 风格级</text>
    <text x="80" y="470" font-size="18" fill="#8A94A0">五个入口 · 十个步骤 · 12 个参考文件</text>

    <!-- 右栏：一句话 → 可写结构 -->
    <text x="700" y="120" font-size="18" fill="#8A94A0">① 一句可争辩的前提</text>
    <rect x="700" y="136" width="420" height="76" rx="16" fill="#FFFFFF" stroke="#EDE3D4" filter="url(#nc-card)"/>
    <rect x="702" y="142" width="5" height="64" rx="2.5" fill="#2F6E8F"/>
    <text x="730" y="182" font-size="22" fill="#1C2430">一个骗子必须骗过自己，才能救人</text>

    <path d="M890 222V250" stroke="#2F6E8F" stroke-width="3" marker-end="url(#nc-arrow)"/>
    <text x="906" y="242" font-size="18" fill="#6B7785">雪花法展开</text>

    <text x="700" y="284" font-size="18" fill="#8A94A0">② 可写的五段结构</text>
    <rect x="700" y="300" width="420" height="190" rx="16" fill="#FFFFFF" stroke="#EDE3D4" filter="url(#nc-card)"/>
    <rect x="702" y="306" width="5" height="178" rx="2.5" fill="#C0452B"/>
    <text x="730" y="336" font-size="22" font-weight="700" fill="#C0452B">①</text>
    <text x="766" y="336" font-size="20" fill="#26313D">开端 · 异常出现</text>
    <text x="730" y="370" font-size="22" font-weight="700" fill="#C0452B">②</text>
    <text x="766" y="370" font-size="20" fill="#26313D">推进 · 因此升级</text>
    <text x="730" y="404" font-size="22" font-weight="700" fill="#C0452B">③</text>
    <text x="766" y="404" font-size="20" fill="#26313D">逆转 · 但是转向</text>
    <text x="730" y="438" font-size="22" font-weight="700" fill="#C0452B">④</text>
    <text x="766" y="438" font-size="20" font-weight="700" fill="#141C26">高潮 · 前提兑现</text>
    <text x="730" y="472" font-size="22" font-weight="700" fill="#C0452B">⑤</text>
    <text x="766" y="472" font-size="20" fill="#8A94A0">余波 · 留下余味</text>

  </g>
</svg>
