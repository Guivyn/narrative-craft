<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" width="100%" role="img" aria-labelledby="nc-hero-title nc-hero-desc">
  <title id="nc-hero-title">叙事工坊 narrative-craft</title>
  <desc id="nc-hero-desc">左侧是技能名「叙事工坊」与三项能力：雪花法搭骨架、剧作理论做诊断、去 AI 味收尾，以及修订顺序 阻断级到结构级到语言级到风格级。右侧演示一句可争辩的前提经雪花法展开成五段大纲：开端异常出现、推进因此升级、逆转但是转向、高潮前提兑现、余波留下余味。</desc>

  <defs>
    <marker id="nc-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#4A7C9B"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="460" rx="18" fill="#0E141B"/>
  <path d="M120 18V442M300 18V442M480 18V442M660 18V442M840 18V442M1020 18V442" stroke="#151F2B" stroke-width="1"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">

    <!-- 雪花标记 -->
    <path d="M80 78H108M87 65.9L101 90.1M87 90.1L101 65.9" stroke="#C8553D" stroke-width="2" stroke-linecap="round" fill="none"/>

    <!-- 左栏 -->
    <text x="118" y="85" font-size="19" letter-spacing="2.5" fill="#7A8798">AGENT SKILL · 中文小说叙事开发</text>
    <text x="76" y="172" font-size="66" font-weight="700" letter-spacing="8" fill="#EDE7DA">叙事工坊</text>
    <text x="78" y="208" font-size="21" letter-spacing="4" fill="#8A93A0">narrative-craft</text>
    <path d="M76 238H600" stroke="#1E2836" stroke-width="1"/>

    <rect x="76" y="266" width="168" height="40" rx="20" fill="#16202B" stroke="#25313F"/>
    <rect x="256" y="266" width="188" height="40" rx="20" fill="#16202B" stroke="#25313F"/>
    <rect x="456" y="266" width="152" height="40" rx="20" fill="#16202B" stroke="#25313F"/>
    <text x="160" y="292" font-size="20" text-anchor="middle" fill="#D9E1E9">雪花法搭骨架</text>
    <text x="350" y="292" font-size="20" text-anchor="middle" fill="#D9E1E9">剧作理论做诊断</text>
    <text x="532" y="292" font-size="20" text-anchor="middle" fill="#D9E1E9">去 AI 味收尾</text>

    <text x="76" y="374" font-size="20" fill="#9AA6B4">修订顺序：<tspan fill="#C8553D">阻断级</tspan> → 结构级 → 语言级 → 风格级</text>
    <text x="76" y="424" font-size="18" fill="#5F6B79">五个入口 · 十个步骤 · 12 个参考文件</text>

    <!-- 右栏：一句话 → 可写结构 -->
    <text x="664" y="90" font-size="20" fill="#7A8798">一句话 → 可写结构</text>

    <rect x="664" y="112" width="460" height="62" rx="14" fill="#16202B" stroke="#25313F"/>
    <text x="690" y="152" font-size="21" fill="#EDE7DA">一个骗子必须骗过自己，才能救人</text>

    <path d="M894 180V212" stroke="#4A7C9B" stroke-width="2" marker-end="url(#nc-arrow)"/>
    <text x="908" y="202" font-size="18" fill="#7A8798">雪花法展开</text>

    <rect x="664" y="228" width="460" height="200" rx="14" fill="#121A24" stroke="#25313F"/>
    <rect x="682" y="252" width="4" height="16" fill="#C8553D"/>
    <rect x="682" y="288" width="4" height="16" fill="#C8553D"/>
    <rect x="682" y="324" width="4" height="16" fill="#C8553D"/>
    <rect x="682" y="360" width="4" height="16" fill="#C8553D"/>
    <rect x="682" y="396" width="4" height="16" fill="#C8553D"/>
    <text x="702" y="266" font-size="20" fill="#D9E1E9">① 开端 · 异常出现</text>
    <text x="702" y="302" font-size="20" fill="#D9E1E9">② 推进 · 因此升级</text>
    <text x="702" y="338" font-size="20" fill="#D9E1E9">③ 逆转 · 但是转向</text>
    <text x="702" y="374" font-size="20" fill="#EDE7DA">④ 高潮 · 前提兑现</text>
    <text x="702" y="410" font-size="20" fill="#8A93A0">⑤ 余波 · 留下余味</text>

  </g>
</svg>
